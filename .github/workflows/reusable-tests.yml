# Reusable Tests
#
# Adapted from BCGov quickstart-openshift to:
#   - Drop integration-tests (no common/tests/integration in this repo).
#   - Drop load-tests   (no k6 scripts; would hammer shared Oracle DEV).
#   - Keep e2e-tests using our existing Playwright suite. Auth is wired up
#     programmatically via E2E_IDIR_USER / E2E_IDIR_PASSWORD secrets, plus
#     E2E_IDIR_TOTP_SECRET for the MFA step, so the suite can run unattended
#     in CI.
name: Reusable Tests

on:
  workflow_call:
    inputs:
      target:
        description: PR number, 'test' or 'prod'
        default: ${{ github.event.number }}
        type: string
      slot:
        description: |
          Route hostname slot. Tests must hit the actual deployed host, which
          for PR previews is `nr-fspts-<PR % 50>.apps...` rather than
          `nr-fspts-<PR>.apps...`. Omit for TEST/PROD; defaults to `target`.
        default: ""
        type: string

    secrets:
      e2e_idir_user:
        description: IDIR service account username for Playwright auth
        required: true
      e2e_idir_password:
        description: IDIR service account password for Playwright auth
        required: true
      e2e_idir_totp_secret:
        description: |
          Base32 authenticator-app secret for the IDIR account's Entra MFA.
          Optional; without it the account must be MFA-exempt.
        required: false

env:
  DOMAIN: apps.silver.devops.gov.bc.ca
  PREFIX: nr-fspts-${{ inputs.slot || inputs.target }}

permissions: {}

jobs:
  e2e-tests:
    name: E2E (${{ matrix.project }})
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-24.04
    # Up to 5 whole-suite attempts (see "Run Playwright"); a passing run is
    # ~2 min, a failing one stops at its first hard failure.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Run chromium only on PRs to keep CI cost down; firefox + safari are
        # added on merge to TEST via the suite's matrix in merge.yml if you
        # want broader coverage there.
        project: [chromium]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright
        env:
          E2E_BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
          E2E_IDIR_USER: ${{ secrets.e2e_idir_user }}
          E2E_IDIR_PASSWORD: ${{ secrets.e2e_idir_password }}
          E2E_IDIR_TOTP_SECRET: ${{ secrets.e2e_idir_totp_secret }}
          CI: "true"
          # Whole-suite attempts. The shared TEST/preview infra has transient
          # outages (connection refused mid-redeploy, stuck auth overlay) that
          # per-test retries can't ride out, so a failed run is re-run from
          # scratch — including the IDIR sign-in — up to this many times.
          # maxFailures: 1 (playwright.config.ts) keeps each failed attempt
          # short. The uploaded report is from the last attempt.
          E2E_RUN_ATTEMPTS: "5"
        run: |
          for attempt in $(seq 1 "$E2E_RUN_ATTEMPTS"); do
            echo "::group::E2E attempt ${attempt}/${E2E_RUN_ATTEMPTS}"
            if npx playwright test --project="${{ matrix.project }}" --reporter=html,list; then
              echo "::endgroup::"
              echo "E2E passed on attempt ${attempt}/${E2E_RUN_ATTEMPTS}."
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::E2E attempt ${attempt}/${E2E_RUN_ATTEMPTS} failed."
          done
          echo "::error::E2E failed on all ${E2E_RUN_ATTEMPTS} attempts."
          exit 1

      - uses: actions/upload-artifact@v7
        if: (! cancelled())
        with:
          name: playwright-report-${{ matrix.project }}-${{ inputs.target }}
          path: frontend/playwright-report
          retention-days: 7
