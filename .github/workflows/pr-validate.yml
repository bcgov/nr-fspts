name: PR Validate

on:
  pull_request:
    types: [edited, opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-edit-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate PR
    if: (! github.event.pull_request.draft)
    permissions:
      pull-requests: write
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-validate.yml@ca6579bdadf383a2513397081f963889b92823a4 # v1.1.0
    with:
      markdown_links: |
        - [Frontend](https://nr-fsp-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
        - [Backend](https://nr-fsp-${{ github.event.number }}.apps.silver.devops.gov.bc.ca/api)

  results:
    name: Validate Results
    if: always()
    needs: [validate]
    runs-on: ubuntu-slim
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
